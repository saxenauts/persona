# Persona v0.3 Reproducibility Package
# Docker Compose configuration for benchmark evaluation
# 
# This configuration locks all versions for reproducible evaluation runs.
# Use this to reproduce PersonaMem and LongMemEval benchmarks.
#
# Usage:
#   docker compose -f release_artifacts/docker-compose.yml up -d
#
# Commit: 2b66a88271a68d81899cf744c9859a74b100936e
# Date: 2026-01-30

services:
  neo4j:
    container_name: persona-neo4j-benchmark
    image: neo4j:5.26.0  # LOCKED VERSION for reproducibility
    restart: always
    env_file:
      - ../.env
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - ./neo4j-data:/data
    networks:
      - persona-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${PASSWORD_NEO4J}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  app:
    container_name: persona-app-benchmark
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../persona:/app/persona
      - ../server:/app/server
      - ../tests:/app/tests
    env_file:
      - ../.env
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - UVICORN_WORKERS=1
      - UVICORN_RELOAD=false  # DISABLED for benchmarks (deterministic)
      - URI_NEO4J=bolt://neo4j:7687
      - PERSONA_BENCHMARK_MODE=true  # ENABLED for benchmark evaluation
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - persona-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  persona-network:
    driver: bridge
