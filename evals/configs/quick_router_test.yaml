# Quick test: 50 questions to compare router vs classic retrieval
# Run with: poetry run python -m evals.cli run --config evals/configs/quick_router_test.yaml

personamem:
  source: evals/data/personamem
  variant: 32k
  samples_per_type: 10  # ~50 questions total across question types

global:
  random_seed: 42
  adapters:
  - persona
  parallel_workers: 4
  checkpoint_dir: evals/results
  deep_logging: true
  output_dir: evals/results
